[project]
name = "job-scout-ranking"
version = "0.1.0"
description = "Job-Scout ranking model + market analysis (build-order steps 4, 5, 7). Reads/writes the shared SQLite DB at ../data/job_scout.db."
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ranking", "analysis"]
