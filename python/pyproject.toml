[project]
name = "job-scout-ranking"
version = "0.1.0"
description = "Job-Scout labeling CLI, ranking model, and market analysis (build-order steps 3, 4, 5, 7). Reads/writes the shared SQLite DB at ../data/job_scout.db."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.9",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labeling", "ranking", "analysis"]
