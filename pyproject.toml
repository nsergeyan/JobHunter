[project]
name = "job-scout"
version = "0.1.0"
description = "Job-search agent + DS portfolio project: scrape, label, rank, and benchmark junior DS/AI vacancies in the Netherlands"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
