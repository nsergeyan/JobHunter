plugins {
    id 'java'
    id 'application'
}

group = 'com.jobscout'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.jobscout.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'


    implementation 'org.jsoup:jsoup:1.18.1'


    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'


    implementation 'io.github.cdimascio:dotenv-java:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// `run` (from the application plugin) executes Main, the scrapers. Extraction is a
// separate entry point that previously had to be launched from the IDE; this gives
// the Python orchestrator a command it can shell out to. Standard output is wired
// through so the orchestrator can stream progress during long extraction runs.
tasks.register('extract', JavaExec) {
    group = 'application'
    description = 'Runs LLM extraction over vacancies that have not been extracted yet'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jobscout.ExtractionMain'
    standardOutput = System.out
    errorOutput = System.err
}
